server:
  port: 8080

logging:
  file:
    name: log\log.log

spring:
  application:
    name: wildnote
  web:
    resources:
      # 指定前端静态资源路径，相对于 wildnote-backend 的路径
      static-locations: file:..\wildnote-frontend\dist

app:
  name: wildnote
  env: dev

  # 指定基于何处认证信息进行认证，app | setting，app=基于应用配置文件认证，setting=基于用户配置文件认证
  auth-by: app
  auth-username: admin
  auth-password: admin
  auth-jwt-secret: secret
  auth-jwt-expires: 30d

  # 笔记根路径，支持绝对路径和相对路径
  #note-root-path: C:\note
  note-root-path: .\src
  note-extensions: .md|.txt
  note-path-prefix-excludes:
  cron-filename-filters: todo|待办
  cron-expression-prefix: "> cron"
  cron-expression-separator: "|"
  # 用户配置文件路径，在笔记根路径下的相对路径
  setting-file-path: wildnote.json
  extra-log-root-path: log\

  # ripgrep 路径
  ripgrep-exe-path: rg.exe
  everything-http-port: 9221
  chrome-cdp-port: 9222

  # 使用钉钉发送提醒消息
  remind-dingtalk-key:
  remind-dingtalk-secret:
  remind-dingtalk-chatid:

  # 使用阿里云短信服务发送短信
  sms-aliyun-key:
  sms-aliyun-secret:
  sms-aliyun-sign:
  sms-aliyun-template:

  # 使用 OpenAI 兼容接口
  openai-base-url:
  openai-api-key:
  openai-model:
